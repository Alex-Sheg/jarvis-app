name: Shipit Cloud Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip python3-venv autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          pip install --user buildozer cython
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Fix sdkmanager path (symlink)
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          # Если папки еще нет — создаем
          mkdir -p "$SDK_DIR/tools/bin"
          mkdir -p "$SDK_DIR/cmdline-tools/latest/bin"
          # Ищем sdkmanager и создаем симлинк туда, где его ждет Buildozer
          if [ -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
          elif [ -f "$SDK_DIR/cmdline-tools/bin/sdkmanager" ]; then
            ln -sf "$SDK_DIR/cmdline-tools/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
          fi
          echo "Symlink created."

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/licenses"
          echo "8933bad161af4b6a5b573652ffc7aaf3aee85a47" > "$SDK_DIR/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131b33910" > "$SDK_DIR/licenses/android-sdk-preview-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/google-tv-preview-license"

      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          yes | buildozer -v android debug
        timeout-minutes: 150

      - name: Show APK outputs
        if: always()
        run: |
          ls -la bin/ 2>/dev/null || echo "(no bin)"
          find . -name "*.apk" 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn

      - name: Create Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shipit-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          files: bin/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
